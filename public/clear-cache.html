<!DOCTYPE html>
<html><head><title>Clearing cache...</title></head>
<body style="background:#0f172a;color:white;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
<div style="text-align:center">
<p style="font-size:48px">🧹</p>
<p>Clearing old data...</p>
</div>
<script>
(async()=>{
  // Delete all caches
  const names = await caches.keys();
  await Promise.all(names.map(n=>caches.delete(n)));
  // Unregister all service workers
  const regs = await navigator.serviceWorker.getRegistrations();
  await Promise.all(regs.map(r=>r.unregister()));
  // Redirect to the real app
  setTimeout(()=>{ window.location.href = '/arthurs-world/#/'; }, 1000);
})();
</script>
</body></html>
